[project]
name = "ProFatXuanAll.github.io"
version = "0.0.0"
description = "ProFatXuanAll.github.io"
authors = [{ name = "ProFatXuanAll", email = "ProFatXuanAll@gmail.com" }]
dependencies = [
  "furo>=2024.5.6",
  "pip>=24.2",
  "setuptools>=74.0.0",
  "sphinx>=8.0.2",
  "sphinx-autobuild>=2024.4.16",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
  "sphinxcontrib-bibtex>=2.6.2",
  "sphinxcontrib-mermaid>=0.9.2",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.pdm.dev-dependencies]
lint = ["ruff>=0.6.3"]
test = ["mypy>=1.11.2", "pytest>=8.3.2"]


[tool.pdm.scripts]
lint = "ruff check --fix source"
build = "sphinx-build -b html source build"
build-coverage = "sphinx-build -b coverage source build"
dev = "sphinx-autobuild --watch . --open-browser source build"

[tool.ruff]
include = ["*.py", "*.pyi"]
indent-width = 2
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120
line-ending = "lf"
quote-style = "single"

[tool.ruff.lint]
ignore = [
  "ANN101",
  "ANN102",
  "COM819",
  "CPY",
  "D203",
  "D213",
  "D413",
  "D416",
  "E111",
  "E114",
  "FA",
  "W191",
  "W505",
]
select = [
  "A",
  "AIR",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "D",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FBT",
  "FIX",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "LOG",
  "N",
  "NPY",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TCH",
  "TD",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
task-tags = ["TODO", "FIXME"]
unfixable = ["B007", "ERA", "F401", "F841"]

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Dict".msg = "Use dict instead."
"typing.List".msg = "Use list instead."

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 20
max-statements = 100
